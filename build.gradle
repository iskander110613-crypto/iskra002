plugins {
    id "fabric-loom" version "1.5.+"
    id "maven-publish"
}

version = "1.0.0"
group = "com.example"

loom {
    accessWidenerPath = file("src/main/resources/flytoggle.accesswidener")
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.13"
}
